name: Build & Release MacTranslate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Run Test Suites
        run: |
          cd lite && swift test

      - name: Build Application Bundle & DMG
        run: |
          cd lite
          chmod +x build_app.sh
          ./build_app.sh
          cp MacTranslate.dmg ../MacTranslate.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacTranslate-DMG
          path: MacTranslate.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MacTranslate.dmg
          name: "MacTranslate ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
