name: Build & Release MacTranslate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || true

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Run Unit Tests
        run: |
          cd lite && swift test --filter LanguagePairRoutingTests || true

      - name: Build Application Bundle & Packages
        run: |
          cd lite
          chmod +x build_app.sh
          bash -x ./build_app.sh
          if [ -f "MacTranslate.dmg" ]; then cp MacTranslate.dmg ../MacTranslate.dmg; fi
          if [ -f "MacTranslate.zip" ]; then cp MacTranslate.zip ../MacTranslate.zip; fi
          cd ..
          ls -la MacTranslate.*

      - name: Upload DMG & ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacTranslate-Artifacts
          path: |
            MacTranslate.dmg
            MacTranslate.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            MacTranslate.dmg
            MacTranslate.zip
          name: "MacTranslate ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
