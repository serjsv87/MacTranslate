name: Build & Release MacTranslate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || true

      - name: Verify Swift Toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Run Unit Tests
        run: |
          cd lite && swift test --filter LanguagePairRoutingTests || true

      - name: Build Application Bundle & Packages
        run: |
          # Build Lite
          cd lite
          chmod +x build_app.sh
          ./build_app.sh > ../build-lite.log 2>&1 || BUILD_FAILED=1
          cd ..
          cat build-lite.log
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "Lite build script failed!"
            exit 1
          fi
          if [ -f "lite/MacTranslate.dmg" ]; then cp lite/MacTranslate.dmg MacTranslate.dmg; fi
          if [ -f "lite/MacTranslate.zip" ]; then cp lite/MacTranslate.zip MacTranslate.zip; fi

          # Build Pro
          cd pro
          chmod +x build_app.sh
          ./build_app.sh > ../build-pro.log 2>&1 || BUILD_FAILED=1
          cd ..
          cat build-pro.log
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "Pro build script failed!"
            exit 1
          fi
          if [ -f "pro/MacTranslate.dmg" ]; then cp pro/MacTranslate.dmg MacTranslate-Pro.dmg; fi
          if [ -f "pro/MacTranslate.zip" ]; then cp pro/MacTranslate.zip MacTranslate-Pro.zip; fi
          ls -la MacTranslate*

      - name: Push Diagnostics Branch On Failure
        if: failure()
        run: |
          git config user.name "CI Bot"
          git config user.email "bot@ci.local"
          git checkout -B ci-diagnostics
          cp build.log ci-diagnostics.txt
          git add ci-diagnostics.txt
          git commit -m "ci diagnostics [skip ci]"
          git push -f origin ci-diagnostics

      - name: Upload DMG & ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacTranslate-Artifacts
          path: |
            MacTranslate.dmg
            MacTranslate.zip
            MacTranslate-Pro.dmg
            MacTranslate-Pro.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            MacTranslate.dmg
            MacTranslate.zip
            MacTranslate-Pro.dmg
            MacTranslate-Pro.zip
          name: "MacTranslate ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
